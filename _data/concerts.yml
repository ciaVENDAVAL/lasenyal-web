# ─────────────────────────────────────────────────────────────
#  CONCERTS — add a new one at the top, copying this pattern:
#
#  - date: 2027-03-14          # day of the concert (YYYY-MM-DD)
#    venue: Sala Apolo         # name of the place
#    place: Poble-sec, Barcelona
#    time: "21:00"             # optional
#    map: https://maps.app.goo.gl/…        # optional, Google Maps link
#    link: https://…                       # optional, tickets / event page
#
#  Concerts move from "upcoming" to "past" on their own the day after.
#
#  Superlunes (weekly Monday residencies): add  residency: true
#  plus  end:  (last Monday, YYYY-MM-DD) and an optional  photo:  from assets/img/sm/.
#  If you only know the year, use  label: "2024"  and that is shown instead of the dates.
# ─────────────────────────────────────────────────────────────

- date: 2026-07-06
