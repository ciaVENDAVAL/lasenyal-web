tagline: "Improvisació en temps real, dirigida amb signes."
intro_label: "La banda"
intro: "La Senyal és un ensemble de percussió, vents i veu de Barcelona. No hi ha repertori fix: cada concert es compon en directe, a partir dels signes de qui dirigeix."
intro2: "Ritmes afrollatins —cúmbia, candombe, salsa— creuats amb funk i balkan. Per escoltar i, sobretot, per ballar."
how_label: "Com funciona"
how:
  - t: "Signes"
    d: "Qui dirigeix compon amb les mans i el cos: marca ritmes, entrades, talls i dinàmiques. La banda respon a l'instant."
  - t: "Direcció rotativa"
    d: "Diversos músics es tornen la direcció. Cada nit sona diferent."
  - t: "Convidades"
    d: "A cada concert s'hi sumen músics convidats."
how_note: "El llenguatge de signes el va crear Santiago Vázquez a Buenos Aires, amb La Bomba de Tiempo."
