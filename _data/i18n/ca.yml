mans:
  home_label: "Toca"
  home_title: "Toca amb les mans"
  home_text: "Cada dit és una nota. Aixeca i plega els dits, tria un instrument per a cada mà (trompeta, saxo, djembé o veu) sobre un ritme de salsa, cúmbia o balkan, i grava el que inventis."
  home_btn: "Toca"
  title: "Mans"
  intro: "A La Senyal la música es fa amb les mans: qui dirigeix fa un senyal i la banda respon. Aquí dirigeixen les teves dues mans."
  how: "Cada dit és una corxera: quatre dits per mà, vuit corxeres, un compàs. Dit aixecat = sona; dit plegat = silenci. Cada mà té el seu instrument. Toca els dits, tria un ritme i grava la teva frase."
