# Hands game (Mans)
mans:
  home_label: "Juega"
  home_title: "Dirige con tus manos"
  home_text: "Un pequeño juego: cada dedo es una nota. Levanta y dobla los dedos sobre un ritmo de salsa, cumbia o balkan, y graba lo que inventes."
  home_btn: "Jugar"
  title: "Manos"
  intro: "En La Senyal la música se hace con las manos: quien dirige hace una seña y la banda responde. Aquí dirigen tus dos manos."
  how: "Cada dedo es una corchea: cuatro dedos por mano, ocho corcheas, un compás. Dedo levantado = suena la trompeta; dedo doblado = silencio. Toca los dedos, elige un ritmo y graba tu frase."
