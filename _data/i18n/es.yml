tagline: "Improvisación en tiempo real, dirigida con señas."

intro_label: "La banda"
intro: "La Senyal es un ensamble de percusión, vientos y voz de Barcelona. No hay repertorio fijo: cada concierto se compone en directo, a partir de las señas de quien dirige."
intro2: "Ritmos afrolatinos —cumbia, candombe, salsa— cruzados con funk y balkan. Para escuchar y, sobre todo, para bailar."

how_label: "Cómo funciona"
how:
  - t: "Señas"
    d: "Quien dirige compone con las manos y el cuerpo: marca ritmos, entradas, cortes y dinámicas. La banda responde al instante."
  - t: "Dirección rotativa"
    d: "Varios músicos se turnan la dirección. Cada noche suena distinta."
  - t: "Invitadxs"
    d: "En cada concierto se suman músicos invitados."
how_note: "El lenguaje de señas lo creó Santiago Vázquez en Buenos Aires, con La Bomba de Tiempo."

