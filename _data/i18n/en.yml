tagline: "Real-time improvisation, conducted with hand signs."

intro_label: "The band"
intro: "La Senyal is a percussion, horns and voice ensemble from Barcelona. There is no set list: every concert is composed live, from the signs of whoever is conducting."
intro2: "Afro-Latin rhythms —cumbia, candombe, salsa— crossed with funk and Balkan brass. For listening and, above all, for dancing."

how_label: "How it works"
how:
  - t: "Signs"
    d: "The conductor composes with hands and body: calling rhythms, entries, breaks and dynamics. The band answers on the spot."
  - t: "Rotating conductors"
    d: "Several musicians take turns conducting. Every night sounds different."
  - t: "Guests"
    d: "Guest musicians join every concert."
how_note: "The sign language was created by Santiago Vázquez in Buenos Aires, with La Bomba de Tiempo."

