# Hands game (Mans)
mans:
  home_label: "Play"
  home_title: "Play with your hands"
  home_text: "Each finger is a note. Raise and fold your fingers, give each hand an instrument (trumpet, sax, djembe or voice) over a salsa, cumbia or Balkan groove, and record what you come up with."
  home_btn: "Play"
  title: "Hands"
  intro: "At La Senyal, music is made with hands: the conductor makes a sign and the band answers. Here, your two hands conduct."
  how: "Each finger is an eighth note: four fingers per hand, eight eighths, one bar. Finger up = it plays; finger folded = rest. Each hand has its own instrument. Tap the fingers, pick a rhythm and record your phrase."
