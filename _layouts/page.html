---
layout: default
---
{%- comment -%} Simple page made in the admin (_extra/<lang>/<name>.md). {%- endcomment -%}
<section class="wrap head">
  <p class="label">/ La Senyal /</p>
  <h1>{{ page.title }}</h1>
  {%- if page.intro %}
  <p class="head__intro">{{ page.intro }}</p>
  {%- endif %}
</section>
{%- if page.image %}
<figure class="wrap band-photo">
  <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt }}" loading="lazy">
</figure>
{%- endif %}
<section class="wrap prose">
  {{ content }}
</section>
