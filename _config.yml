# La Senyal — GitHub Pages (plain Jekyll, no plugins needed)
title: La Senyal

# STAGING: served at https://ciavendaval.github.io/lasenyal-web/
# When you move the domain, set   url: https://lasenyal.com   baseurl: ""
# and add a file named CNAME containing: lasenyal.com   (see README)
url: https://ciavendaval.github.io
baseurl: /lasenyal-web

# PDFs (press kit…) live in pdf/ → <site>/pdf/… ; which one each short link
# (/dossier/<lang>/) points to: _data/downloads.yml

# Languages, in switcher order. ES stays at the root like the old site.
# "pages" = the address of each page in that language.
languages:
  - code: ca
    label: CA
    name: Català
    locale: ca_ES
    pages: { home: /ca/, members: /ca/equip/, concerts: /ca/concerts/, hands: /ca/mans/ }
  - code: es
    label: ES
    name: Castellano
    locale: es_ES
    pages: { home: /, members: /equipo/, concerts: /conciertos/, hands: /manos/ }
  - code: en
    label: EN
    name: English
    locale: en_GB
    pages: { home: /en/, members: /en/members/, concerts: /en/concerts/, hands: /en/hands/ }

# Contact details, footer text and main photos: _data/site.yml (editable in the admin)

exclude:
  - README.md
  - CLAUDE.md
  - UPDATING.md
  - CHECK-REPORT.md
  - tools
  - dossiers
  - source-images
  - preview
  - Gemfile
  - Gemfile.lock

# Simple pages made in the admin ("Pages"): _extra/<lang>/<name>.md
collections:
  extra:
    output: true
defaults:
  - scope: { path: "_extra/ca", type: extra }
    values: { lang: ca, layout: page, permalink: "/ca/:name/" }
  - scope: { path: "_extra/es", type: extra }
    values: { lang: es, layout: page, permalink: "/:name/" }
  - scope: { path: "_extra/en", type: extra }
    values: { lang: en, layout: page, permalink: "/en/:name/" }
