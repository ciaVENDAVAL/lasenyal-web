# La Senyal — GitHub Pages (plain Jekyll, no plugins needed)
title: La Senyal

# STAGING: served at https://ciavendaval.github.io/lasenyal-web/
# When you move the domain, set   url: https://lasenyal.com   baseurl: ""
# and add a file named CNAME containing: lasenyal.com   (see README)
url: https://ciavendaval.github.io
baseurl: /lasenyal-web

# PDFs (press kit…) live in the lasenyal-docs repo
docs_base: https://ciavendaval.github.io/lasenyal-docs/pdf/

# Languages, in switcher order. ES stays at the root like the old site.
# "pages" = the address of each page in that language.
languages:
  - code: ca
    label: CA
    name: Català
    locale: ca_ES
    pages: { home: /ca/, members: /ca/equip/, concerts: /ca/concerts/, hands: /ca/mans/ }
  - code: es
    label: ES
    name: Castellano
    locale: es_ES
    pages: { home: /, members: /equipo/, concerts: /conciertos/, hands: /manos/ }
  - code: en
    label: EN
    name: English
    locale: en_GB
    pages: { home: /en/, members: /en/members/, concerts: /en/concerts/, hands: /en/hands/ }

contact:
  email: lasenyalbcn@gmail.com
  phones: ["+34 647 60 49 57", "+34 691 74 07 03"]
  instagram: https://www.instagram.com/lasenyalbcn/
  video: https://www.youtube.com/watch?v=mnEiAivFHJ8

exclude:
  - README.md
  - scripts
  - preview
  - Gemfile
  - Gemfile.lock
